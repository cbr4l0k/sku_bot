services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/sku.db
    volumes:
      - sku_data:/app/data
    expose:
      - "3000"
    networks:
      default: {}
      web:
        aliases: [sku_bot_app]

  # Only for a host without the shared Caddy: docker compose --profile standalone up -d
  caddy:
    profiles: ["standalone"]
    image: caddy:2
    profiles: ["standalone"]
    restart: unless-stopped
    # Lets Caddy reach the VPN's Xray on the host (172.17.0.1:10000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

networks:
  web:
    external: true

# The shared Caddy keeps its certificates in caddy_data and caddy_config (as
# sku_bot_caddy_data / sku_bot_caddy_config); never remove them.
volumes:
  sku_data:
  caddy_data:
  caddy_config:
