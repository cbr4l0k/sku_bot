<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <!-- Every native control in the app sits on white paper (the inputs and the
         datetime pickers above all), so the UA lays them out for a light
         surface in both schemes. -->
    <meta name="color-scheme" content="light" />
    <!-- The brand teal, straight off the club icon. Both schemes paint the same
         field, so there is one value and the client chrome never sits on a
         seam. -->
    <meta name="theme-color" content="#0097a8" />
    <title>СКУ Клуб</title>
    <!-- Telegram's own bridge: the only script served from Telegram; fonts and
         every other asset are bundled locally. Absent outside Telegram, which
         src/telegram.ts handles gracefully. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
