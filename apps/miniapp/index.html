<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <!-- Both schemes are a teal field with white type, so the UA must always
         lay out native controls for a dark surface. -->
    <meta name="color-scheme" content="dark" />
    <!-- Brand teal, matched to the field each scheme actually paints, so the
         client chrome never sits on a seam. The plain tag is the fallback. -->
    <meta name="theme-color" content="#01353d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#015d68" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#015d68" />
    <title>СКУ Клуб</title>
    <!-- Telegram's own bridge: the only script served from Telegram; fonts and
         every other asset are bundled locally. Absent outside Telegram, which
         src/telegram.ts handles gracefully. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
